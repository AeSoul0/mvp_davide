<!--
  @file src/components/hero.html
  @description Hero header section with video background and main title.
-->
<header class="hero" id="home">
  <div class="hero-video-wrapper">
    <video id="hero-video" muted loop playsinline tabindex="-1" aria-hidden="true" poster="assets/video/hero-poster.webp">
      <source data-src="assets/video/hero-mobile.mp4" media="(max-width: 768px)" type="video/mp4">
      <source data-src="assets/video/hero-chopin.mp4" type="video/mp4">
    </video>
    <div class="hero-overlay"></div>
  </div>
  <div class="hero-content">
    <div class="hero-bottom-left reveal">
      <div class="hero-label">ROMA / PIANISTA</div>
      <h1 class="hero-title">DAVIDE<br>LOMBARDI</h1>
      <p class="hero-subtitle">Interprete, musicista e studioso della cultura musicale.</p>
    </div>
    <div class="hero-bottom-right reveal delay-1">
      <div class="hero-signature" role="img" aria-label="Firma di Davide Lombardi">
        <svg viewBox="0 0 700 940" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="sig-gold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#E2C67E"/>
              <stop offset="0.55" stop-color="#B99A53"/>
              <stop offset="1" stop-color="#8F7438"/>
            </linearGradient>
            <!-- Pen path: each stroke uncovers the signature as if it were being written -->
            <mask id="sig-pen" maskUnits="userSpaceOnUse" x="0" y="0" width="700" height="940">
              <g fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
                <path class="sig-stroke" pathLength="1" d="M305 30C250 110 150 220 95 310C40 400 20 520 30 610C45 720 100 775 145 772C185 770 215 740 235 705"/>
                <path class="sig-stroke" pathLength="1" stroke-width="56" d="M302 40L282 300L288 485"/>
                <path class="sig-stroke" pathLength="1" d="M285 485C230 485 200 440 200 395C200 340 240 305 290 305C335 305 357 345 355 395C352 445 330 480 290 488"/>
                <path class="sig-stroke" pathLength="1" stroke-width="70" d="M282 495C275 540 255 600 248 650C242 700 225 790 200 840L170 880C150 872 125 885 122 905C120 925 140 928 158 915C175 900 185 888 195 885L260 912"/>
                <path class="sig-stroke" pathLength="1" stroke-width="66" d="M345 488L318 508L300 659L358 551L379 662L421 560L412 650L478 560L469 647C490 600 515 575 536 572C515 580 500 600 500 625C500 645 520 655 554 644L603 400L566 644C580 625 595 600 608 581C620 560 630 530 641 527C655 525 662 535 656 545C650 565 640 580 635 590C620 605 605 610 608 617C612 635 625 640 632 638C650 630 665 615 678 605"/>
                <path class="sig-stroke" pathLength="1" d="M488 528L492 545"/>
              </g>
            </mask>
          </defs>
          <rect width="700" height="940" fill="url(#sig-gold)" mask="url(#sig-pen)"/>
        </svg>
      </div>
      <div class="hero-actions">
        <a href="#music" class="cta-primary">ASCOLTA</a>
        <a href="#contatti" class="cta-secondary">CONTATTI</a>
      </div>
    </div>
  </div>
  <div class="scroll-indicator">
    <span>SCROLL</span>
    <div class="scroll-line"></div>
  </div>
</header>

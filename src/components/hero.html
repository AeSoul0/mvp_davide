<!--
  @file src/components/hero.html
  @description Hero header section with video background and main title.
-->
<header class="hero" id="home">
  <div class="hero-video-wrapper">
    <video autoplay muted loop playsinline tabindex="-1" aria-hidden="true" poster="assets/video/hero-poster.webp">
      <source src="assets/video/hero-mobile.mp4" media="(max-width: 768px)" type="video/mp4">
      <source src="assets/video/hero-chopin.mp4" type="video/mp4">
    </video>
    <div class="hero-overlay"></div>
  </div>
  <div class="hero-content">
    <div class="hero-bottom-left reveal">
      <div class="hero-label">ROMA / PIANISTA</div>
      <h1 class="hero-title">DAVIDE<br>LOMBARDI</h1>
      <p class="hero-subtitle">Interprete, musicista e studioso della cultura musicale.</p>
    </div>
    <div class="hero-bottom-right reveal delay-1">
      <div class="hero-actions">
        <a href="#music" class="cta-primary">ASCOLTA</a>
        <a href="#contatti" class="cta-secondary">CONTATTI</a>
      </div>
    </div>
  </div>
  <div class="scroll-indicator">
    <span>SCROLL</span>
    <div class="scroll-line"></div>
  </div>
</header>

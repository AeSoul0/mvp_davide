<!--
  @file src/404.html
  @description "Page not found" page, served by the host for unknown URLs.
-->
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina non trovata — Davide Lombardi</title>
<meta name="robots" content="noindex">
<!--
  @file src/components/simple-head.html
  @description Shared head assets for the secondary pages (privacy, 404).
  Paths are root-relative so the 404 page works at any URL depth.
-->
<meta name="theme-color" content="#0A1422">
<link rel="icon" href="/assets/images/favicon.ico" sizes="any">
<link rel="icon" href="/assets/images/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/playfair-display-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="simple-page">
<header class="simple-header">
  <div class="container">
    <a href="/" class="brand">DAVIDE LOMBARDI</a>
  </div>
</header>


<main class="simple-main error-page">
  <div class="container">
    <p class="error-code" aria-hidden="true">404</p>
    <h1>Questa pagina non esiste.</h1>
    <p class="simple-lead">Forse l'indirizzo è sbagliato o la pagina è stata spostata.</p>
    <a href="/" class="cta-primary">TORNA ALLA HOME</a>
  </div>
</main>

<!--
  @file src/components/simple-footer.html
  @description Shared footer for the secondary pages (privacy, 404).
-->
<footer class="simple-footer">
  <div class="container">
    <a href="/" class="text-link">&larr; Torna alla home</a>
    <span>Davide Lombardi — Pianista, Roma</span>
  </div>
</footer>
</body>
</html>
